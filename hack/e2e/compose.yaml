# The controller as the Docker runbook expects it: the official image, the
# container named jenkins, JENKINS_HOME in the named volume jenkins_home.
# The image comes from .env, which is what an administrator edits.
services:
  jenkins:
    image: ${JENKINS_IMAGE:?set JENKINS_IMAGE in .env}
    container_name: jenkins
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-e2e-admin}
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - ci

volumes:
  jenkins_home:
    name: jenkins_home

networks:
  ci:
    name: ci
